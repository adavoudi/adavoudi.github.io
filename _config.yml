title: Alireza Davoudi
tagline: Senior Data Engineer
author:
  name: Alireza Davoudi
  email: davoudialireza@gmail.com
description: >-
  Senior data engineer at Yelp. I build streaming and lakehouse data platforms
  on AWS and write about the cloud engineering underneath them.
url: https://adavoudi.info
lang: en
image: /assets/img/og.png
google_analytics: G-3FWPK6J51D

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# jekyll-seo-tag only reads `image` from page front matter, so the site-wide
# share image has to come in through defaults.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/og.png

social:
  name: Alireza Davoudi
  links:
    - https://github.com/adavoudi
    - https://www.linkedin.com/in/alireza-davoudi/

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - README.md
  - .bundle

highlighter: rouge
markdown: kramdown
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    default_lang: text
