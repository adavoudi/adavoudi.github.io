<footer class="footer">
  <div class="footer__inner">
    <p class="footer__line">
      <strong>{{ site.author.name }}</strong>
      <span>Data engineer. Cloud tinkerer. Writes things down so they stick.</span>
    </p>
    <ul class="footer__links">
      {%- for l in site.data.profile.links -%}
      <li><a href="{{ l.url }}" rel="noopener me"><svg class="ico"><use href="#i-{{ l.icon }}"/></svg>{{ l.label }}</a></li>
      {%- endfor -%}
      <li><a href="{{ '/feed.xml' | relative_url }}"><svg class="ico"><use href="#i-rss"/></svg>RSS</a></li>
    </ul>
    <p class="footer__fine">&copy; {{ 'now' | date: '%Y' }} {{ site.author.name }}. Built with Jekyll and three.js.</p>
  </div>
</footer>
