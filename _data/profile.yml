  - { code: DEA, name: "Data Engineer",       level: Associate,    tier: 2, from: "#62e6d5", to: "#8b7bff" }
  - { code: DVA, name: "Developer",           level: Associate,    tier: 2, from: "#8b7bff", to: "#ef6f5e" }
  - { code: SOA, name: "SysOps Administrator", level: Associate,   tier: 2, from: "#62e6d5", to: "#ffb45c" }
